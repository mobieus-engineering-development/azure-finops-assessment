name: Commit Signing

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: commit-signing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-signed-commits:
    name: Verify all commits are signed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit signatures
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "Checking commits from $BASE_SHA to $HEAD_SHA"

          UNSIGNED=""
          while IFS= read -r commit; do
            # GitHub verifies registered GPG/SSH/S/MIME signatures. Local %G?
            # cannot reliably verify keys missing from the ephemeral runner.
            VERIFIED=$(gh api "repos/$REPOSITORY/commits/$commit" --jq '.commit.verification.verified')
            if [ "$VERIFIED" = "true" ]; then
              echo "✅ $commit — verified by GitHub"
            else
              echo "❌ $commit — signature is not verified by GitHub"
              UNSIGNED="$UNSIGNED $commit"
            fi
          done < <(git rev-list "$BASE_SHA".."$HEAD_SHA")

          if [ -n "$UNSIGNED" ]; then
            echo ""
            echo "The following commits are not signed:"
            for c in $UNSIGNED; do
              git log -1 --oneline "$c"
            done
            echo ""
            echo "All PR commits must have a GitHub-verified signature."
            echo "See: https://docs.github.com/en/authentication/managing-commit-signature-verification"
            exit 1
          fi

          echo ""
          echo "All commits are signed."
